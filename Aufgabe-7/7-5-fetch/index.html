<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Kommentare</title>
  <script src="script.js" defer></script>
</head>
<body>
  <h2>Kommentar hinzufügen</h2>
  <form id="commentForm">
    <label for="username">Benutzername (3–16 Zeichen):</label><br>
    <input type="text" id="username" name="username" minlength="3" maxlength="16" required><br><br>

    <label for="message">Nachricht (3–300 Zeichen):</label><br>
    <textarea id="message" name="message" minlength="3" maxlength="300" required></textarea><br><br>

    <button type="submit">Absenden</button>
  </form>

  <p id="status"></p>
</body>
</html>
